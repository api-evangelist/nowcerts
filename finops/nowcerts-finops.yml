meters:
- name: subscription_tier
  description: The monthly subscription tier (Essentials, Professional, Business, Enterprise) that determines feature and API-integration access.
  unit: subscription
  aggregation: max
  dimensions:
  - account
  - tier
- name: user_seats
  description: Number of licensed user seats; additional users are billed per user per month above the tier allotment.
  unit: users
  aggregation: sum
  dimensions:
  - account
- name: api_integrations
  description: Number of API integrations in use against the per-tier cap (limited on Professional, unlimited on Business and Enterprise).
  unit: integrations
  aggregation: sum
  dimensions:
  - account
- name: file_storage
  description: File storage consumed against the per-tier storage allotment (roughly 10 GB to 1 TB).
  unit: bytes
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track which subscription tier and how many user seats each agency office holds; confirm whether the tier is chosen for API access it actually uses.
- name: Allocation
  description: Map seat count and tier to the office or team using NowCerts so cost is attributed to the right cost center.
- name: Optimization
  description: Right-size the tier to actual need - do not pay for Business/Enterprise unlimited API integrations if a Professional cap suffices; batch imports via bulk endpoints to keep integration count low.
- name: Accountability
  description: Assign an owner to review the NowCerts invoice against active seats and integrations, and watch for the vendor's known price changes at renewal.
