description: >-
  FinOps view of NowCerts (Momentum AMP) spend. NowCerts is a flat per-agency
  SaaS subscription billed monthly, with tiers (Essentials, Professional,
  Business, Enterprise) that bundle storage and a per-tier number of API
  integrations, plus per-additional-user pricing. The API itself carries no
  separate metered fee - its cost is the subscription tier required to unlock
  API integrations (Professional and above) and any additional user seats. Spend
  is therefore driven by tier selection and seat count rather than by API call
  volume.
notes: >-
  Per-unit rates are not reconciled here and have shifted over time; verify
  current tier prices, additional-user cost, and API-integration caps on the
  official pricing page. There is no usage-metered API billing to model - the
  meters below track the seat- and tier-based cost drivers.
