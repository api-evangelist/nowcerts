name: NowCerts
kind: company
description: >-
  NowCerts (rebranded to Momentum AMP, but the API is still served from
  api.nowcerts.com) is a cloud insurance agency management system (AMS) for
  independent agencies. It exposes a documented REST API that lets agencies and
  their integration partners import, update, and retrieve their own book of
  business - insureds and prospects, policies and coverages, carriers and
  underwriters, endorsements and commissions, tasks and workflow, drivers,
  vehicles, properties, claims, certificates of insurance, notes, SMS, and
  payments. The API is token-authenticated and reachable by any NowCerts agency
  whose account has the "API Integration" agent role assigned; API integrations
  are gated to the Professional tier and above. Endpoints are documented on the
  public ASP.NET Web API help page at api.nowcerts.com/Help and are widely used
  through Zapier and partner integrations.
